[project]
name = "neuron-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "datasets",
    "accelerate",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
